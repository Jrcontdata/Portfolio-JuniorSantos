<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio</title>
<meta name="description" content="Portfólio de análise de dados e processos aplicados a PCP, produção e logística.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="w">
  <a class="logo" href="#sobre" id="logo"></a>
  <nav class="menu" id="menu" aria-label="Seções"></nav>
</div></header>

<main class="w">
  <section id="sobre">
    <div class="hero" id="hero">
      <div>
        <p class="nome" id="nome"></p>
        <h1 id="titulo"></h1>
        <div class="resumo" id="resumo"></div>
        <div class="chips" id="vagas"></div>
        <div class="formacao" id="formacao"></div>
        <div class="cta">
          <a class="btn p" href="#projetos">Ver projetos</a>
          <a class="btn" href="#contato">Contato</a>
        </div>
      </div>
      <div class="pic" id="pic"></div>
    </div>
  </section>

  <section id="experiencia"><h2>Experiência</h2><div class="cards" id="exp"></div></section>
  <section id="habilidades"><h2>Habilidades</h2><div class="skills" id="skills"></div></section>
  <section id="projetos">
    <h2>Projetos</h2>
    <div class="filters" id="f" role="group" aria-label="Filtrar projetos"></div>
    <div class="grid" id="g"></div>
  </section>
  <section id="cursos"><h2>Cursos e certificações</h2><div class="cards" id="cur"></div></section>
  <section id="contato"><h2>Contato</h2><div class="cta" id="contatos"></div></section>
</main>
<footer><div class="w" id="rodape"></div></footer>

<script src="projetos.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tem=n=>{try{return Array.isArray(eval(n))&&eval(n).length>0}catch(e){return false}};
const TIPOS={all:"Todos",case:"Cases",ferramenta:"Por ferramenta",processo:"Processos",industria:"Indústria"};
const ST={ok:["Concluído","ok"],wip:["Em construção","wip"],todo:["Planejado","todo"]};
const CST={concluido:"Concluído",andamento:"Em andamento"};
let atual="all";

/* Topo e resumo */
document.title=PERFIL.nome+": portfólio";
$("logo").textContent=PERFIL.nome.split(" ").filter(w=>w.length>3).map(w=>w[0]).join("");
$("nome").textContent=PERFIL.nome;
$("titulo").textContent=PERFIL.titulo;
const paras=Array.isArray(PERFIL.resumo)?PERFIL.resumo:String(PERFIL.resumo||"").split(/\n{2,}/);
$("resumo").innerHTML=paras.filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("");
$("vagas").innerHTML=(PERFIL.vagas||[]).map(v=>`<span class="chip">${esc(v)}</span>`).join("");
if(PERFIL.foto){$("hero").classList.add("foto");$("pic").innerHTML=`<img src="${esc(PERFIL.foto)}" alt="Foto de ${esc(PERFIL.nome)}">`}
if(typeof FORMACAO!=="undefined"&&FORMACAO.length){
  $("formacao").innerHTML=FORMACAO.map(f=>`<div><strong>${esc(f.curso)}</strong>${f.instituicao?", "+esc(f.instituicao):""}${f.periodo?" ("+esc(f.periodo)+")":""}</div>`).join("");
}

/* Experiência */
$("exp").innerHTML=EXPERIENCIAS.map(e=>`<div class="card"><h3>${esc(e.titulo)}</h3>${(e.empresa||e.periodo)?`<p class="meta">${esc([e.empresa,e.periodo].filter(Boolean).join(" · "))}</p>`:""}<p>${esc(e.texto)}</p></div>`).join("");

/* Habilidades: esteira rolante */
const ICONES={
  grade:'<rect x="7" y="9" width="34" height="30" rx="4"/><path d="M7 19h34M7 29h34M19 9v30"/>',
  banco:'<ellipse cx="24" cy="12" rx="14" ry="5"/><path d="M10 12v24c0 2.8 6.3 5 14 5s14-2.2 14-5V12M10 24c0 2.8 6.3 5 14 5s14-2.2 14-5"/>',
  grafico:'<path d="M9 40h32"/><rect x="11" y="24" width="7" height="16" rx="1.5"/><rect x="21" y="13" width="7" height="27" rx="1.5"/><rect x="31" y="19" width="7" height="21" rx="1.5"/>',
  codigo:'<path d="M18 14L7 24l11 10M30 14l11 10-11 10M27 9l-6 30"/>',
  fluxo:'<circle cx="9" cy="24" r="4"/><rect x="18" y="18" width="12" height="12" rx="2.5"/><path d="M42 24l-5-6-5 6 5 6z"/><path d="M13 24h5M30 24h2"/>',
  caixa:'<path d="M24 6L7 14v20l17 8 17-8V14z"/><path d="M7 14l17 8 17-8M24 22v20"/>',
  documento:'<path d="M12 5h17l9 9v29H12z"/><path d="M29 5v9h9M18 25h14M18 32h14"/>',
  relogio:'<circle cx="24" cy="24" r="17"/><path d="M24 13v11l7 5"/>',
  caminhao:'<path d="M4 13h25v21H4zM29 21h8l7 8v5H29z"/><circle cx="14" cy="36" r="4"/><circle cx="36" cy="36" r="4"/>',
  alvo:'<circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="10"/><circle cx="24" cy="24" r="3"/>',
  monitor:'<rect x="6" y="9" width="36" height="24" rx="3"/><path d="M17 41h14M24 33v8"/>',
  ciclo:'<path d="M39 20a15 15 0 0 0-27-6M9 28a15 15 0 0 0 27 6"/><path d="M12 5v9h9M36 43v-9h-9"/>',
  ponto:'<circle cx="24" cy="24" r="10"/>'
};
if(typeof HABILIDADES!=="undefined"&&HABILIDADES.length){
  /* aceita o formato novo (nome, icone, cor) e o antigo (grupo, itens) */
  let lista=[];
  HABILIDADES.forEach(h=>{ if(h.itens)h.itens.forEach(n=>lista.push({nome:n})); else lista.push(h); });
  const cardSk=h=>`<div class="sk" style="--c:${esc(h.cor||"var(--acc)")}"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">${ICONES[h.icone]||ICONES.ponto}</svg><span class="sk-nome">${esc(h.nome)}</span>${h.nivel?`<small>${esc(h.nivel)}</small>`:""}<i class="sk-barra"></i></div>`;
  let base=lista.slice(); while(base.length<10)base=base.concat(lista);
  const faixa=base.map(cardSk).join("");
  const box=$("skills"); box.className="esteira-wrap";
  box.innerHTML=`<div class="esteira-topo"><p class="esteira-dica">Passe o cursor sobre a esteira para pausar.</p><button type="button" class="btn s" id="esteira-btn" aria-pressed="false">Pausar</button></div><div class="esteira" id="esteira" style="--dur:${Math.max(28,base.length*4)}s"><div class="esteira-faixa"><div class="set">${faixa}</div><div class="set dup" aria-hidden="true">${faixa}</div></div></div>`;
  $("esteira-btn").addEventListener("click",e=>{
    const p=$("esteira").classList.toggle("pausada");
    e.currentTarget.textContent=p?"Retomar":"Pausar";
    e.currentTarget.setAttribute("aria-pressed",p);
  });
}else $("habilidades").remove();

/* Cursos */
if(typeof CURSOS!=="undefined"&&CURSOS.length){
  $("cur").innerHTML=CURSOS.map(c=>`<div class="card curso">${c.imagem?`<img src="${esc(c.imagem)}" alt="${esc(c.alt||c.nome)}" loading="lazy">`:""}<div class="txt"><h3>${esc(c.nome)}</h3><p class="meta">${esc([c.instituicao,c.ano,c.carga].filter(Boolean).join(" · "))}</p>${c.status?`<span class="st ${c.status==="concluido"?"ok":"wip"}">${CST[c.status]||esc(c.status)}</span>`:""}${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">Ver certificado</a>`:""}</div></div>`).join("");
}else $("cursos").remove();

/* Projetos */
function acoesHTML(i){
  const l=[...(i.arquivos||[]),...(i.links||[])];
  if(!l.length)return "";
  if(l.length===1)return `<div class="acoes"><a class="btn s" href="${esc(l[0].url)}" target="_blank" rel="noopener">${esc(l[0].texto)}</a></div>`;
  return `<div class="acoes"><details class="dd"><summary class="btn s">Código e arquivos</summary><div class="list">${l.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener"><span>${esc(x.texto)}</span>${x.tipo?`<small>${esc(x.tipo)}</small>`:""}</a>`).join("")}</div></details></div>`;
}
function render(){
  $("f").innerHTML=Object.entries(TIPOS).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===atual}">${v}</button>`).join("");
  $("g").innerHTML=ITEMS.filter(i=>atual==="all"||i.tipo===atual).map(i=>`
  <article class="card proj ${i.tipo==="case"?"case":""} ${i.imagem?"has-img":""}">
    ${i.imagem?`<a class="shot" href="${esc(i.imagem)}" target="_blank" rel="noopener"><img src="${esc(i.imagem)}" alt="${esc(i.alt||i.titulo)}" loading="lazy"></a>`:""}
    <span class="st ${ST[i.status][1]}">${ST[i.status][0]}</span>
    <h3>${esc(i.titulo)}</h3>
    <p>${esc(i.descricao)}</p>
    <div class="tags">${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    ${i.etapas?`<details class="et"><summary>Etapas</summary><ul>${i.etapas.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></details>`:""}
    ${acoesHTML(i)}
  </article>`).join("");
}
$("f").addEventListener("click",e=>{const k=e.target.dataset.k;if(k){atual=k;render()}});
document.addEventListener("click",e=>{document.querySelectorAll("details.dd[open]").forEach(d=>{if(!d.contains(e.target))d.removeAttribute("open")})});
render();

/* Contato e rodapé */
$("contatos").innerHTML=`<a class="btn p" href="mailto:${esc(PERFIL.email)}">${esc(PERFIL.email)}</a><a class="btn" href="${esc(PERFIL.linkedin)}" target="_blank" rel="noopener">LinkedIn</a><a class="btn" href="${esc(PERFIL.github)}" target="_blank" rel="noopener">GitHub</a>`;
$("rodape").textContent=PERFIL.local||"";

/* Menu superior com destaque da seção atual */
const NAV=[["sobre","Sobre"],["experiencia","Experiência"],["habilidades","Habilidades"],["projetos","Projetos"],["cursos","Cursos"],["contato","Contato"]].filter(([id])=>$(id));
$("menu").innerHTML=NAV.map(([id,t])=>`<a href="#${id}" data-id="${id}">${t}</a>`).join("");
const links=[...document.querySelectorAll("#menu a")];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle("on",a.dataset.id===e.target.id))}})},{rootMargin:"-40% 0px -55% 0px"});
NAV.forEach(([id])=>io.observe($(id)));
</script>
</body>
</html>
